<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="3D movie glasses on black">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#fff"/><stop offset=".5" stop-color="#dedede"/><stop offset="1" stop-color="#929292"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#78fff0"/><stop offset="1" stop-color="#00aebc"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7279"/><stop offset="1" stop-color="#e51f3a"/>
    </linearGradient>
    <filter id="glow" x="-.4" y="-.4" width="1.8" height="1.8">
      <feGaussianBlur stdDeviation="12" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0.05  0 1 0 0 0.1  0 0 1 0 0.12  0 0 0 .32 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#050505"/>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="#252525" stroke-width="5"/>
