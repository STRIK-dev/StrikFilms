    <path d="M108 218 60 184q-10-7-18 2-8 10 0 20l55 51" fill="none" stroke="#111" stroke-width="25"/>
    <path d="M108 218 60 184q-10-7-18 2-8 10 0 20l55 51" fill="none" stroke="url(#frame)" stroke-width="14"/>
    <path d="m404 218 48-34q10-7 18 2 8 10 0 20l-55 51" fill="none" stroke="#111" stroke-width="25"/>
    <path d="m404 218 48-34q10-7 18 2 8 10 0 20l-55 51" fill="none" stroke="url(#frame)" stroke-width="14"/>
    <!-- outer silhouette -->
    <path d="M111 194q-12-2-17 10l-15 42q-8 23 8 41l49 54q11 12 29 12h70q19 0 29-16l24-39 24 39q10 16 29 16h70q18 0 29-12l49-54q16-18 8-41l-15-42q-5-12-17-10l-111 16q-24 4-42 22l-24 25-24-25q-18-18-42-22z" fill="#000" stroke="#111" stroke-width="30"/>
    <path d="M111 194q-12-2-17 10l-15 42q-8 23 8 41l49 54q11 12 29 12h70q19 0 29-16l24-39 24 39q10 16 29 16h70q18 0 29-12l49-54q16-18 8-41l-15-42q-5-12-17-10l-111 16q-24 4-42 22l-24 25-24-25q-18-18-42-22z" fill="none" stroke="url(#frame)" stroke-width="17"/>
    <!-- lenses -->
    <path d="m106 214 97 14q21 3 37 19l24 25-28 45q-5 8-15 8h-57q-9 0-15-7l-45-49q-8-9-4-20z" fill="url(#cyan)" stroke="#101010" stroke-width="10"/>
    <path d="m406 214-97 14q-21 3-37 19l-24 25 28 45q5 8 15 8h57q9 0 15-7l45-49q8-9 4-20z" fill="url(#red)" stroke="#101010" stroke-width="10"/>
    <!-- lens highlights -->
    <path d="m108 225 68 10-36 55-28-30q-7-8-4-17z" fill="#eaffff" opacity=".48" stroke="none"/>
    <path d="m404 225-68 10 36 55 28-30q7-8 4-17z" fill="#fff0f0" opacity=".38" stroke="none"/>
    <!-- nose bridge -->
    <path d="M231 225q25-14 50 0" fill="none" stroke="url(#frame)" stroke-width="13"/>
